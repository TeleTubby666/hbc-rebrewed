name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20251117
    strategy:
      fail-fast: false
      matrix:
        variant: [default, nolto]
    steps:
      - uses: actions/checkout@v4

      - name: Host dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip \
            python3-pycryptodome libpng-dev gettext sox gcc make xxd
          dkp-pacman -Sy --noconfirm --needed ppc-zlib ppc-libpng ppc-mxml \
            ppc-freetype ppc-libmad || true

      - name: Link brotli if freetype needs it
        run: |
          if [ -f /opt/devkitpro/portlibs/ppc/lib/libbrotlidec.a ]; then
            sed -i 's/^LIBS = mxml freetype /LIBS = mxml freetype brotlidec brotlicommon /' channel/channelapp/Makefile
          fi
          grep -n "^LIBS" channel/channelapp/Makefile

      - name: Disable LTO (variant nolto)
        if: matrix.variant == 'nolto'
        run: |
          sed -i 's/ -flto=auto//g' channel/channelapp/Makefile
          sed -i 's/ -flto$//; s/ -flto / /g' wiipax/stub/Makefile
          grep -rn "flto" channel/channelapp/Makefile wiipax/stub/Makefile || echo "LTO removed"

      - name: Common key (optional, needed for the WAD)
        env:
          WII_COMMON_KEY_HEX: ${{ secrets.WII_COMMON_KEY_HEX }}
        run: |
          mkdir -p "$HOME/.wii"
          if [ -n "$WII_COMMON_KEY_HEX" ]; then
            printf '%s' "$WII_COMMON_KEY_HEX" | xxd -r -p > "$HOME/.wii/common-key" 2>/dev/null \
              || python3 -c "import sys,os;open(os.path.expanduser('~/.wii/common-key'),'wb').write(bytes.fromhex(sys.argv[1]))" "$WII_COMMON_KEY_HEX"
            echo "HAVE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "No WII_COMMON_KEY_HEX secret set - building DOLs only"
          fi

      - name: Build wiipax
        run: make -C wiipax

      - name: Build channel app
        run: make -C channel/channelapp channel

      - name: DOL segment check
        run: python3 .github/scripts/dolinfo.py channel/channelapp/channelapp-channel.dol

      - name: Build WAD
        if: env.HAVE_KEY == '1'
        run: |
          make -C channel/banner
          make -C channel/title

      - name: Collect artifacts
        run: |
          mkdir -p out/apps/hbc-rebrewed-${{ matrix.variant }}
          cp channel/channelapp/channelapp.elf out/apps/hbc-rebrewed-${{ matrix.variant }}/boot.elf
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<app version="1">\n  <name>HBC Rebrewed (%s)</name>\n  <version>test-%s</version>\n  <short_description>Testbuild %s</short_description>\n</app>\n' \
            "${{ matrix.variant }}" "$(echo $GITHUB_SHA | cut -c1-7)" "${{ matrix.variant }}" \
            > out/apps/hbc-rebrewed-${{ matrix.variant }}/meta.xml
          cp channel/channelapp/channelapp-channel.dol out/ || true
          cp channel/title/channel_retail.wad out/hbc-rebrewed-${{ matrix.variant }}.wad 2>/dev/null || true
          ls -lR out

      - uses: actions/upload-artifact@v4
        with:
          name: hbc-rebrewed-${{ matrix.variant }}
          path: out/
